<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1>待辦清單</h1>
        <button id="theme-toggle" class="theme-toggle" type="button"></button>
      </header>

      <form id="todo-form" class="todo-form" novalidate>
        <input
          id="todo-input"
          type="text"
          maxlength="120"
          placeholder="新增待辦事項"
          aria-label="待辦事項輸入框"
        />
        <button type="submit">新增</button>
      </form>

      <nav class="todo-filters" aria-label="待辦事項篩選">
        <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">未完成</button>
        <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">已完成</button>
      </nav>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state" hidden>
        還沒有任何待辦事項,新增一個吧!
      </p>

      <footer class="todo-footer">
        <button
          id="clear-completed"
          class="clear-completed-btn"
          type="button"
          aria-label="清除所有已完成的待辦事項"
          hidden
        >
          清除已完成
        </button>
        <span id="remaining-count">未完成:0 項</span>
      </footer>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
